services:
  api-a:
    build: .
    image: municipal-gis-api:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      GIS_DB_PATH: /data/gis.db
      GIS_BUSY_TIMEOUT_S: "30"
      # bounded admission for POST /api/v1/batches: 8 executing + 32 queued =
      # 40 accepted in-flight requests per process; over capacity -> 503
      GIS_BATCH_EXECUTOR_SLOTS: "8"
      GIS_BATCH_QUEUE_CAPACITY: "32"
    volumes:
      - gis-data:/data
    healthcheck:
      test: ["CMD", "python", "app/healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  api-b:
    build: .
    image: municipal-gis-api:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8002:8000"
    environment:
      GIS_DB_PATH: /data/gis.db
      GIS_BUSY_TIMEOUT_S: "30"
      GIS_BATCH_EXECUTOR_SLOTS: "8"
      GIS_BATCH_QUEUE_CAPACITY: "32"
    volumes:
      - gis-data:/data
    healthcheck:
      test: ["CMD", "python", "app/healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # One-shot demo runner (functional scenarios + held-lock/capacity/cancel):
  #   docker compose --profile demo run --rm demo
  demo:
    build: .
    image: municipal-gis-api:latest
    profiles: ["demo"]
    restart: "no"
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    volumes:
      - gis-data:/data
    environment:
      GIS_DB_PATH: /data/gis.db
    command:
      [
        "python",
        "-m",
        "examples.run_all_demos",
        "--base-a",
        "http://api-a:8000",
        "--base-b",
        "http://api-b:8000",
      ]

volumes:
  gis-data:
